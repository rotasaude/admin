<!doctype html>
<html lang="pt-BR">

<meta charset="utf-8" />
<title>Rota Saúde · Admin Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: oklch(98.4% 0.002 255); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { height: 100%; }
  code { font-family: var(--mono); }
  button { font-family: var(--sans); }
  ::selection { background: oklch(90% 0.05 264); }

  /* scrollbars — slim, neutral */
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: oklch(86% 0.005 255); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: oklch(78% 0.006 255); border: 2px solid transparent; background-clip: content-box; }

  @keyframes acpulse { 0% { transform: scale(1); opacity: 0.4; } 70% { transform: scale(2.4); opacity: 0; } 100% { opacity: 0; } }
  @keyframes acshimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
